plugins {
    id 'com.android.application'
}

android {
    namespace 'com.apsc.qcab'
    compileSdk 35

    defaultConfig {
        applicationId "com.apsc.qcab"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    // No third-party runtime dependency: the app works fully offline.
}
